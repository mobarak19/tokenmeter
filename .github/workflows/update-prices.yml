name: Update prices

# Hosting is Cloudflare Pages, which rebuilds on every push to main.
# This job only refreshes the LLM price data and commits it; that push
# triggers the Cloudflare deploy.

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit refreshed price data

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh LLM prices
        run: npm run update-data

      # Don't commit data that breaks the build.
      - name: Build
        run: npm run build

      - name: Commit data changes
        run: |
          if [ -n "$(git status --porcelain src/data)" ]; then
            git config user.name "price-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "chore: refresh LLM prices $(date -u +%F)"
            git push
          fi
